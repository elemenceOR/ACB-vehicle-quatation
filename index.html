<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Planner – Vehicle Modification Quote</title>
<link rel="icon" type="image/avif" href="resources/logo1.avif">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="noprint">
<h1 style="display:flex;align-items:center;gap:12px"><img id="hl" alt="Avant Custom Builds logo" style="height:52px;background:#fff;border-radius:8px;padding:4px">Build Planner</h1>
</header>

<main>
<div>
<section class="card">
<h2>Customer and Vehicle Information</h2>
<div class="grid2">
<div><label for="cn">Customer name</label><input id="cn" autocomplete="off"></div>
<div><label for="cp">Phone</label><input id="cp" type="tel"></div>
<div><label for="vm">Vehicle make and model</label><input id="vm" placeholder="e.g. Toyota Land Cruiser Prado"></div>
<div><label for="vp">Plate number</label><input id="vp"></div>
</div>
<div style="margin-top:10px"><label for="ideas">Customer’s ideas and requirements</label>
<textarea id="ideas" placeholder="Style, colours, references, budget, deadline…"></textarea></div>
<div style="margin-top:10px"><label for="ph">Photos of the car or reference ideas</label><input id="ph" type="file" accept="image/*" multiple><div id="gal"></div></div>
<datalist id="cols"><option value="Gloss black"><option value="Satin black"><option value="Matte black"><option value="Gloss white"><option value="Pearl white"><option value="Silver"><option value="Gunmetal grey"><option value="Nardo grey"><option value="Red"><option value="Candy red"><option value="Blue"><option value="Midnight blue"><option value="Green"><option value="Military green"><option value="Yellow"><option value="Orange"><option value="Gold"><option value="Bronze"><option value="Purple"><option value="Chrome"><option value="Carbon fibre"><option value="Brushed titanium"><option value="Tan leather"><option value="Two-tone"></datalist>
</section>

<section class="card">
<h2>Choose the work</h2>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="items" id="items"></div>
<h3 style="margin:18px 0 8px;font-size:20px">Something not listed</h3>
<div class="row">
<div style="flex:3 1 200px"><label for="cu">Description</label><input id="cu"></div>
<div style="flex:0 0 auto"><button class="btn alt" id="addc">Add item</button></div>
</div>
</section>
</div>

<aside class="card" aria-live="polite">
<h2>Quotation</h2>
<div id="lines"></div>
<div id="tots" style="margin-top:12px"></div>
<button class="btn" id="gen" style="width:100%;margin-top:12px">Generate Quotation</button>
<button class="btn alt" id="dlq" style="width:100%;margin-top:8px">Download Quotation PDF</button>
<button class="btn alt" id="reset" style="width:100%;margin-top:8px">Reset Quotation</button>
</aside>
</main>

<div id="inv">
<div class="noprint" style="max-width:820px;margin:16px auto;display:flex;flex-wrap:wrap;gap:8px;padding:0 12px">
<button class="btn" id="dlp">Download PDF</button>
<button class="btn alt" id="csv">Save Quote Data (CSV)</button>
<button class="btn alt" id="sheets">Save to Google Sheet</button>
<button class="btn alt" id="resetPreview">Reset Quotation</button>
<button class="btn alt" id="prt">Print</button>
<button class="btn alt" id="back">Back to Quote</button>
</div>
<div class="sheet" id="sheet"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
